<style>
  #project-list-sketch { padding: 24px 12px; }
  #project-list-sketch .todo-window {
    --todo-paper: light-dark(#fbfaf7, #242522);
    --todo-ink: light-dark(#282c28, #edeee9);
    --todo-secondary: light-dark(#666b62, #b1b8ac);
    --todo-line: light-dark(#dedfd6, #484e44);
    --todo-accent: light-dark(#476539, #b6d8a3);
    --todo-selected: light-dark(#e7ebdf, #394233);
    --todo-hover: light-dark(#efefe8, #30332c);
    --todo-shadow: light-dark(#18201018, #00000036);
    --todo-row-space: 7px;
    box-sizing: border-box; max-width: 424px; min-height: 438px;
    margin: 0 auto; background: var(--todo-paper); color: var(--todo-ink);
    border: 1px solid var(--todo-line); border-radius: 12px;
    box-shadow: 0 10px 28px var(--todo-shadow);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow-wrap: anywhere;
  }
  #project-list-sketch .todo-window * { box-sizing: border-box; }
  #project-list-sketch .todo-window button,
  #project-list-sketch .todo-window input,
  #project-list-sketch .todo-window textarea { font: inherit; color: inherit; }
  #project-list-sketch .todo-chrome { height: 31px; padding: 0 14px; display: flex; align-items: center; gap: 6px; }
  #project-list-sketch .todo-light { width: 9px; height: 9px; border: 1px solid var(--todo-line); border-radius: 50%; }
  #project-list-sketch .todo-nav { display: flex; align-items: center; gap: 5px; padding: 3px 14px 12px; border-bottom: 1px solid var(--todo-line); }
  #project-list-sketch .todo-tabs { display: flex; flex-wrap: wrap; gap: 3px; flex: 1; min-width: 0; }
  #project-list-sketch .todo-tab { background: transparent; border: 0; border-radius: 5px; padding: 5px 9px; font-size: 13px !important; color: var(--todo-secondary); }
  #project-list-sketch .todo-tab[aria-pressed="true"] { background: var(--todo-selected); color: var(--todo-accent); font-weight: 600; }
  #project-list-sketch .todo-tab:hover { background: var(--todo-hover); }
  #project-list-sketch .todo-icon-button { border: 0; background: transparent; color: var(--todo-secondary); min-width: 28px; min-height: 28px; display: inline-flex; align-items: center; justify-content: center; border-radius: 4px; flex-shrink: 0; }
  #project-list-sketch .todo-icon-button:hover { background: var(--todo-hover); }
  #project-list-sketch .todo-icon-button svg { width: 15px; height: 15px; }
  #project-list-sketch .todo-body { padding: 17px 16px 26px; }
  #project-list-sketch .todo-row { display: grid; grid-template-columns: 27px minmax(0, 1fr); align-items: start; padding: var(--todo-row-space) 0; }
  #project-list-sketch .todo-check-target { display: flex; width: 27px; min-height: 28px; align-items: center; position: relative; }
  #project-list-sketch .todo-check { appearance: none; width: 14px; height: 14px; border: 1.3px solid var(--todo-secondary); border-radius: 50%; margin: 0; background: transparent; }
  #project-list-sketch .todo-check:checked { background: var(--todo-accent); border-color: var(--todo-accent); }
  #project-list-sketch .todo-check-target svg { position: absolute; left: 2px; top: 9px; width: 10px; height: 10px; color: var(--todo-paper); pointer-events: none; display: none; }
  #project-list-sketch .todo-check:checked + svg { display: block; }
  #project-list-sketch .todo-heading { min-height: 28px; display: flex; align-items: start; min-width: 0; }
  #project-list-sketch .todo-open { display: flex; align-items: baseline; gap: 10px; width: 100%; min-height: 28px; padding: 2px 0; border: 0; background: transparent; text-align: left; }
  #project-list-sketch .todo-task-title { flex: 1; min-width: 0; }
  #project-list-sketch .todo-open svg { width: 12px; height: 12px; flex-shrink: 0; align-self: center; color: var(--todo-secondary); }
  #project-list-sketch .todo-complete .todo-task-title,
  #project-list-sketch .todo-complete .todo-title-editor { color: var(--todo-secondary); text-decoration: line-through; }
  #project-list-sketch .todo-title-editor { width: 100%; min-width: 0; padding: 2px 0; border: 0; border-radius: 2px; background: transparent; resize: none; overflow: hidden; }
  #project-list-sketch .todo-notes { grid-column: 2; margin: 8px 0 9px; }
  #project-list-sketch .todo-notes-label { display: block; color: var(--todo-secondary); font-size: 12px; margin-bottom: 5px; }
  #project-list-sketch .todo-notes-editor { display: block; width: 100%; padding: 0; border: 0; border-radius: 2px; background: transparent; resize: none; overflow: hidden; font-size: 13px !important; line-height: 1.6 !important; min-height: 22px; }
  #project-list-sketch .todo-notes-editor:placeholder-shown { min-height: 26px; }
  #project-list-sketch .todo-subtasks { grid-column: 2; margin: 0 0 8px; }
  #project-list-sketch .todo-subtask { display: grid; grid-template-columns: 27px minmax(0, 1fr); align-items: start; padding: 3px 0; }
  #project-list-sketch .todo-subtask-title { display: block; width: 100%; min-width: 0; background: transparent; border: 0; padding: 4px 0; font-size: 13px !important; }
  #project-list-sketch .todo-subtask-title::placeholder { color: var(--todo-secondary); opacity: 1; }
  #project-list-sketch .todo-subtask.is-done .todo-subtask-title { color: var(--todo-secondary); text-decoration: line-through; }
  #project-list-sketch .todo-subtask-add { margin: 3px 0 0; }
  #project-list-sketch .todo-add { display: grid; grid-template-columns: 27px minmax(0, 1fr); margin-top: 10px; align-items: center; }
  #project-list-sketch .todo-add svg { width: 14px; height: 14px; color: var(--todo-secondary); }
  #project-list-sketch .todo-add-input { width: 100%; min-width: 0; border: 0; border-radius: 2px; padding: 5px 0; background: transparent; }
  #project-list-sketch .todo-add-input::placeholder { color: var(--todo-secondary); opacity: 1; }
  #project-list-sketch .todo-new-project { margin: 0 16px; padding: 10px 0; border-bottom: 1px solid var(--todo-line); }
  #project-list-sketch .todo-new-project[hidden] { display: none; }
  #project-list-sketch .todo-new-project label { color: var(--todo-secondary); font-size: 12px; }
  #project-list-sketch .todo-new-project input { display: block; width: 100%; background: transparent; border: 0; padding: 5px 0; }
  #project-list-sketch .todo-visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
  @media (max-width: 390px) {
    #project-list-sketch { padding: 14px 3px; }
    #project-list-sketch .todo-body { padding-inline: 12px; }
  }
  @media (pointer: coarse) {
    #project-list-sketch .todo-tab,
    #project-list-sketch .todo-icon-button,
    #project-list-sketch .todo-check-target,
    #project-list-sketch .todo-open { min-height: 44px; }
    #project-list-sketch .todo-check-target svg { top: 17px; }
    #project-list-sketch .todo-title-editor,
    #project-list-sketch .todo-notes-editor,
    #project-list-sketch .todo-add-input { font-size: 16px !important; }
    #project-list-sketch .todo-title-editor { min-height: 44px; padding-block: 10px; }
  }
</style>
<div id="project-list-sketch" class="viz-dotted-background">
  <section class="todo-window" aria-label="Project checklist design sketch">
    <div class="todo-chrome" aria-hidden="true"><span class="todo-light"></span><span class="todo-light"></span><span class="todo-light"></span></div>
    <nav class="todo-nav" aria-label="Projects">
      <div class="todo-tabs"></div>
      <button class="todo-icon-button cursor-interaction" type="button" aria-label="Add project" aria-expanded="false"><i data-lucide="plus" aria-hidden="true"></i></button>
    </nav>
    <form class="todo-new-project" hidden>
      <label>Project name<input name="project" autocomplete="off" placeholder="Name, then Return" maxlength="60"></label>
    </form>
    <div class="todo-body">
      <div class="todo-items" role="group" aria-label="Tasks"></div>
      <form class="todo-add">
        <i data-lucide="plus" aria-hidden="true"></i>
        <input class="todo-add-input" name="task" aria-label="Add a task, then press Return" placeholder="Add a task…" autocomplete="off">
      </form>
    </div>
    <div class="todo-visually-hidden" role="status" aria-live="polite"></div>
  </section>
</div>
<script>
(() => {
  const root = document.getElementById('project-list-sketch');
  const panel = root.querySelector('.todo-window');
  const tabs = root.querySelector('.todo-tabs');
  const items = root.querySelector('.todo-items');
  const addForm = root.querySelector('.todo-add');
  const projectForm = root.querySelector('.todo-new-project');
  const projectButton = root.querySelector('.todo-nav > button');
  const status = root.querySelector('[role="status"]');
  const defaults = {
    version: 1,
    selected: 'app',
    projects: [
      { id: 'inbox', name: 'Inbox', tasks: [{ id: 'i1', title: 'An idea to come back to', notes: '', done: false }] },
      { id: 'app', name: 'App', tasks: [
        { id: 'a1', title: 'Sketch the main window', notes: 'A small window that can stay beside whatever I’m working on.', done: false },
        { id: 'a2', title: 'Make project switching feel instant', notes: 'Remember where I was in each list.', done: false, subtasks: [{ title: 'Keep the tabs in place', done: true }, { title: 'Restore open task details', done: false }] },
        { id: 'a3', title: 'Keep agent updates in sync', notes: 'Updates should appear quietly while I keep typing.', done: false },
        { id: 'a4', title: 'Read through the UI guide', notes: '', done: true }
      ] },
      { id: 'personal', name: 'Personal', tasks: [
        { id: 'p1', title: 'Plan the weekend', notes: 'Leave a little room for doing nothing.', done: false },
        { id: 'p2', title: 'Pick up groceries', notes: '', done: false }
      ] }
    ],
    expanded: { app: 'a2' },
    drafts: {},
    rowSpace: 7
  };
  let state = structuredClone(defaults);
  const saved = window.openai?.widgetState?.privateContent;
  if (saved?.version === 1 && Array.isArray(saved.projects) && saved.projects.length && saved.projects.some(p => p.id === saved.selected)) {
    state = { ...state, ...saved };
  }
  function current() { return state.projects.find(p => p.id === state.selected); }
  function save() {
    const snapshot = { modelContent: { sketch: 'Named project tabs with inline task details', selectedProject: current().name, rowSpacing: state.rowSpace }, privateContent: state };
    if (JSON.stringify(snapshot).length < 15000) window.openai?.setWidgetState?.(snapshot)?.catch(() => {});
  }
  function icon(name) {
    const el = document.createElement('i'); el.dataset.lucide = name; el.setAttribute('aria-hidden', 'true'); return el;
  }
  function icons() { globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } }); }
  function fit(field) { field.style.height = 'auto'; field.style.height = field.scrollHeight + 'px'; }
  function label(text, className) { const el = document.createElement('span'); el.className = className; el.textContent = text; return el; }
  function renderItems() {
    const project = current();
    items.replaceChildren();
    items.setAttribute('aria-label', project.name + ' tasks');
    for (const task of project.tasks) {
      const open = state.expanded[project.id] === task.id;
      const row = document.createElement('div'); row.className = 'todo-row' + (task.done ? ' todo-complete' : ''); row.dataset.task = task.id;
      const target = document.createElement('label'); target.className = 'todo-check-target cursor-interaction';
      const check = document.createElement('input'); check.type = 'checkbox'; check.className = 'todo-check cursor-interaction'; check.checked = task.done; check.setAttribute('aria-label', 'Complete: ' + task.title);
      check.addEventListener('change', () => { task.done = check.checked; row.classList.toggle('todo-complete', task.done); save(); });
      target.append(check, icon('check'));
      const heading = document.createElement('div'); heading.className = 'todo-heading';
      if (open) {
        const title = document.createElement('textarea'); title.className = 'todo-title-editor'; title.rows = 1; title.value = task.title; title.setAttribute('aria-label', 'Task title');
        title.addEventListener('input', () => { task.title = title.value; check.setAttribute('aria-label', 'Complete: ' + task.title); fit(title); save(); });
        const collapse = document.createElement('button'); collapse.type = 'button'; collapse.className = 'todo-icon-button cursor-interaction'; collapse.setAttribute('aria-label', 'Collapse task details'); collapse.setAttribute('aria-expanded', 'true'); collapse.append(icon('chevron-down'));
        collapse.addEventListener('click', () => { delete state.expanded[project.id]; renderItems(); items.querySelector('[data-task="' + task.id + '"] .todo-open')?.focus(); save(); });
        heading.append(title, collapse);
        row.append(target, heading);
        const notes = document.createElement('div'); notes.className = 'todo-notes';
        const editor = document.createElement('textarea'); editor.className = 'todo-notes-editor'; editor.rows = 1; editor.value = task.notes; editor.placeholder = 'Add details…'; editor.setAttribute('aria-label', 'Optional task details');
        editor.addEventListener('input', () => { task.notes = editor.value; fit(editor); save(); });
        notes.append(editor); row.append(notes);
        const subtasks = document.createElement('div'); subtasks.className = 'todo-subtasks'; subtasks.setAttribute('role', 'group'); subtasks.setAttribute('aria-label', 'Subtasks');
        for (const child of (task.subtasks || [])) {
          const subrow = document.createElement('div'); subrow.className = 'todo-subtask' + (child.done ? ' is-done' : '');
          const hit = document.createElement('label'); hit.className = 'todo-check-target cursor-interaction';
          const toggle = document.createElement('input'); toggle.type = 'checkbox'; toggle.className = 'todo-check cursor-interaction'; toggle.checked = child.done; toggle.setAttribute('aria-label', 'Complete subtask: ' + child.title);
          toggle.addEventListener('change', () => { child.done = toggle.checked; subrow.classList.toggle('is-done', child.done); save(); });
          hit.append(toggle, icon('check'));
          const title = document.createElement('input'); title.className = 'todo-subtask-title'; title.value = child.title; title.setAttribute('aria-label', 'Subtask title');
          title.addEventListener('input', () => { child.title = title.value; toggle.setAttribute('aria-label', 'Complete subtask: ' + child.title); save(); });
          subrow.append(hit, title); subtasks.append(subrow);
        }
        const addChild = document.createElement('form'); addChild.className = 'todo-add todo-subtask-add'; addChild.append(icon('plus'));
        const childEntry = document.createElement('input'); childEntry.className = 'todo-subtask-title'; childEntry.placeholder = 'Add subtask…'; childEntry.setAttribute('aria-label', 'Add subtask, then press Return');
        addChild.append(childEntry);
        addChild.addEventListener('submit', event => { event.preventDefault(); const title = childEntry.value.trim(); if (!title) return; (task.subtasks ||= []).push({title, done:false}); renderItems(); items.querySelector('[data-task="' + task.id + '"] .todo-subtask-add input')?.focus(); save(); });
        subtasks.append(addChild); row.append(subtasks); items.append(row);
        requestAnimationFrame(() => { fit(title); fit(editor); });
      } else {
        const show = document.createElement('button'); show.type = 'button'; show.className = 'todo-open cursor-interaction'; show.setAttribute('aria-expanded', 'false'); show.setAttribute('aria-label', task.title + ', expand details'); show.append(label(task.title, 'todo-task-title'), icon('chevron-right'));
        show.addEventListener('click', () => { state.expanded[project.id] = task.id; renderItems(); items.querySelector('[data-task="' + task.id + '"] .todo-heading > button')?.focus(); save(); });
        heading.append(show); row.append(target, heading); items.append(row);
      }
    }
    icons();
  }
  function render() {
    tabs.replaceChildren();
    for (const project of state.projects) {
      const button = document.createElement('button'); button.type = 'button'; button.className = 'todo-tab cursor-interaction'; button.textContent = project.name; button.setAttribute('aria-pressed', String(project.id === state.selected));
      button.addEventListener('click', () => {
        state.drafts[state.selected] = addForm.elements.task.value;
        state.selected = project.id;
        for (const tab of tabs.children) tab.setAttribute('aria-pressed', String(tab === button));
        addForm.elements.task.value = state.drafts[state.selected] || '';
        renderItems(); save();
      });
      tabs.append(button);
    }
    addForm.elements.task.value = state.drafts[state.selected] || '';
    panel.style.setProperty('--todo-row-space', state.rowSpace + 'px');
    renderItems();
  }
  addForm.addEventListener('submit', event => {
    event.preventDefault(); const title = addForm.elements.task.value.trim(); if (!title) return;
    current().tasks.push({ id: 'task-' + Date.now(), title, notes: '', done: false });
    addForm.elements.task.value = ''; state.drafts[state.selected] = ''; renderItems(); status.textContent = 'Task added'; save();
  });
  addForm.elements.task.addEventListener('input', () => { state.drafts[state.selected] = addForm.elements.task.value; save(); });
  projectButton.addEventListener('click', () => {
    projectForm.hidden = !projectForm.hidden; projectButton.setAttribute('aria-expanded', String(!projectForm.hidden));
    if (!projectForm.hidden) projectForm.elements.project.focus();
  });
  projectForm.addEventListener('submit', event => {
    event.preventDefault(); const name = projectForm.elements.project.value.trim(); if (!name) return;
    const id = 'project-' + Date.now(); state.projects.push({ id, name, tasks: [] }); state.selected = id;
    projectForm.reset(); projectForm.hidden = true; projectButton.setAttribute('aria-expanded', 'false'); render(); addForm.elements.task.focus(); save();
  });
  window.addEventListener('openai:set_globals', event => {
    const next = event.detail?.globals?.widgetState?.privateContent;
    if (next?.version !== 1 || !Array.isArray(next.projects) || !next.projects.some(p => p.id === next.selected)) return;
    if (JSON.stringify(next) === JSON.stringify(state)) return;
    state = { ...structuredClone(defaults), ...next }; render();
  });
  render();
  if (globalThis.Tweak) {
    const design = { rowSpace: state.rowSpace };
    const tweak = new Tweak({ container: panel, onChange: () => { state.rowSpace = design.rowSpace; panel.style.setProperty('--todo-row-space', state.rowSpace + 'px'); save(); } });
    tweak.addSlider(design, 'rowSpace', { label: 'Space between tasks', min: 3, max: 12, step: 1, unit: 'px' });
  }
})();
</script>
