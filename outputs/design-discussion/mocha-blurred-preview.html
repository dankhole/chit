<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mocha + blur — selected design</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #111213; color: #ececec; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .study { padding: 26px 26px 30px; }
    .study-header { display: flex; justify-content: space-between; align-items: baseline; gap: 24px; margin: 0 0 24px; }
    .study-header h1 { margin: 0; font-size: 19px; font-weight: 500; }
    .study-header span { color: #aaaaaa; font-size: 12px; }
    .palette-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
    .opacity-grid { display: grid; grid-template-columns: 1fr; max-width: 488px; margin: 0 auto; }
    figure { margin: 0; min-width: 0; }
    figcaption { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 14px; }
    figcaption strong { font-size: 14px; font-weight: 500; }
    figcaption span { font-size: 12px; color: #aaaaaa; }
    .swatch { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 8px; }
    .desktop { position: relative; overflow: hidden; padding: 42px 32px; border-radius: 10px; background: radial-gradient(ellipse at 95% 100%, #b78952 0%, transparent 66%), radial-gradient(ellipse at 0 20%, #32677d 0%, transparent 66%), #3d374f; }
    .desktop-document { position: absolute; top: 15px; left: 92px; right: -35px; height: 340px; background: #eee9e0; color: #383b3c; border: 1px solid #ffffff38; border-radius: 7px; box-shadow: 0 8px 24px #00000018; overflow: hidden; }
    .desktop-document header { height: 29px; padding: 7px 15px; background: #dad7d0; color: #62645f; font-size: 11px; }
    .desktop-document article { padding: 26px 28px; }
    .desktop-document h2 { font-size: 22px; font-weight: 500; margin: 0 0 14px; }
    .desktop-document p { color: #656764; margin: 9px 0; line-height: 1.9; }
    .desktop .mock-root { position: relative; z-index: 1; }
    .footer { margin: 20px 0 0; font-size: 12px; color: #aaaaaa; }
    [hidden] { display: none !important; }

  .mock-root { padding: 20px 12px; color-scheme: dark; }
  .mock-root .todo-window {
    --todo-paper: #191919;
    --todo-ink: #eeeeee;
    --todo-secondary: #bdbdbd;
    --todo-line: #ffffff18;
    --todo-accent: #a3be8c;
    --todo-selected: #ffffff10;
    --todo-hover: #ffffff08;
    --todo-shadow: #00000040;
    --todo-row-space: 1px;
    box-sizing: border-box; max-width: 424px;
    margin: 0 auto; background: var(--todo-paper); color: var(--todo-ink);
    border: 1px solid var(--todo-line); border-radius: 10px;
    box-shadow: 0 10px 28px var(--todo-shadow);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow-wrap: anywhere;
  }
  .mock-root .todo-window * { box-sizing: border-box; }
  .mock-root .todo-window button,
  .mock-root .todo-window input,
  .mock-root .todo-window textarea { font: inherit; color: inherit; }
  .mock-root .todo-chrome { height: 24px; padding: 0 12px; display: flex; align-items: center; gap: 6px; }
  .mock-root .todo-light { width: 9px; height: 9px; background: #ffffff18; border-radius: 50%; }
  .mock-root .todo-nav { display: flex; align-items: start; gap: 4px; padding: 0 8px 7px; border-bottom: 1px solid var(--todo-line); }
  .mock-root .todo-tabs { display: flex; align-items: start; flex-wrap: wrap; gap: 5px; flex: 1; min-width: 0; }
  .mock-root .todo-tab { background: transparent; border: 0; border-radius: 4px; min-height: 28px; padding: 4px 6px; font-size: 12px !important; color: var(--todo-secondary); }
  .mock-root .todo-tab[aria-pressed="true"] { background: var(--todo-selected); color: var(--todo-accent); font-weight: 500; }
  .mock-root .todo-tab:hover { background: var(--todo-hover); }
  .mock-root .todo-tab-group { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 1px; max-width: 100%; }
  .mock-root .todo-tab-group.is-collapsed { border-bottom-color: transparent; }
  .mock-root .todo-group-toggle { display: inline-flex; align-items: center; gap: 3px; min-height: 28px; padding: 4px; background: transparent; border: 0; border-radius: 4px; font-size: 12px !important; font-weight: 400; color: var(--todo-secondary); }
  .mock-root .todo-group-toggle svg { width: 11px; height: 11px; flex-shrink: 0; }
  .mock-root .todo-group-toggle:hover { background: var(--todo-hover); }
  .mock-root .todo-group-toggle.is-current { background: var(--todo-selected); color: var(--todo-accent); }
  .mock-root .todo-group-projects { display: inline-flex; flex-wrap: wrap; gap: 1px; min-width: 0; }
  .mock-root .todo-group-projects[hidden] { display: none; }
  .mock-root .todo-icon-button { border: 0; background: transparent; color: var(--todo-secondary); min-width: 28px; min-height: 28px; display: inline-flex; align-items: center; justify-content: center; border-radius: 4px; flex-shrink: 0; }
  .mock-root .todo-icon-button:hover { background: var(--todo-hover); }
  .mock-root .todo-icon-button svg { width: 15px; height: 15px; }
  .mock-root .todo-body { padding: 8px 12px 12px; }
  .mock-root .todo-row { display: grid; grid-template-columns: 24px minmax(0, 1fr); align-items: start; padding: var(--todo-row-space) 0; }
  .mock-root .todo-check-target { display: flex; width: 24px; min-height: 28px; align-items: center; position: relative; }
  .mock-root .todo-check { appearance: none; width: 13px; height: 13px; border: 1.2px solid var(--todo-secondary); border-radius: 50%; margin: 0; background: transparent; }
  .mock-root .todo-check:checked { background: var(--todo-accent); border-color: var(--todo-accent); }
  .mock-root .todo-check-target svg { position: absolute; left: 2px; top: 10px; width: 9px; height: 9px; color: #191919; pointer-events: none; display: none; }
  .mock-root .todo-check:checked + svg { display: block; }
  .mock-root .todo-heading { min-height: 28px; display: flex; align-items: start; min-width: 0; }
  .mock-root .todo-open { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 28px; padding: 3px 0; border: 0; background: transparent; text-align: left; }
  .mock-root .todo-task-title { flex: 1; min-width: 0; }
  .mock-root .todo-open svg { width: 12px; height: 12px; flex-shrink: 0; align-self: center; color: var(--todo-secondary); }
  .mock-root .todo-complete .todo-task-title,
  .mock-root .todo-complete .todo-title-editor { color: var(--todo-secondary); text-decoration: line-through; }
  .mock-root .todo-title-editor { width: 100%; min-width: 0; min-height: 28px; padding: 4px 0; border: 0; border-radius: 2px; background: transparent; resize: none; overflow: hidden; }
  .mock-root .todo-notes { grid-column: 2; margin: 0 0 3px; }
  .mock-root .todo-notes-label { display: block; color: var(--todo-secondary); font-size: 12px; margin-bottom: 5px; }
  .mock-root .todo-notes-editor { display: block; width: 100%; padding: 0; border: 0; border-radius: 2px; background: transparent; color: var(--todo-secondary) !important; resize: none; overflow: hidden; font-size: 13px !important; line-height: 1.5 !important; min-height: 22px; }
  .mock-root .todo-notes-editor:placeholder-shown { min-height: 26px; }
  .mock-root .todo-subtasks { grid-column: 2; margin: 0 0 3px; }
  .mock-root .todo-subtask { display: grid; grid-template-columns: 24px minmax(0, 1fr); align-items: start; padding: 0; }
  .mock-root .todo-subtask-title { display: block; width: 100%; min-width: 0; background: transparent; border: 0; padding: 4px 0; font-size: 13px !important; }
  .mock-root .todo-subtask-title::placeholder { color: var(--todo-secondary); opacity: 1; }
  .mock-root .todo-subtask.is-done .todo-subtask-title { color: var(--todo-secondary); text-decoration: line-through; }
  .mock-root .todo-add { display: grid; grid-template-columns: 24px minmax(0, 1fr); margin-top: 3px; align-items: center; }
  .mock-root .todo-subtask-add { margin: 0; }
  .mock-root .todo-add svg { width: 14px; height: 14px; color: var(--todo-secondary); }
  .mock-root .todo-add-input { width: 100%; min-width: 0; border: 0; border-radius: 2px; padding: 5px 0; background: transparent; }
  .mock-root .todo-add-input::placeholder { color: var(--todo-secondary); opacity: 1; }
  .mock-root .todo-new-project { margin: 0 16px; padding: 10px 0; border-bottom: 1px solid var(--todo-line); }
  .mock-root .todo-new-project[hidden] { display: none; }
  .mock-root .todo-new-project label { color: var(--todo-secondary); font-size: 12px; }
  .mock-root .todo-new-project input { display: block; width: 100%; background: transparent; border: 0; padding: 5px 0; }
  .mock-root .todo-visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
  @media (max-width: 390px) {
    .mock-root { padding: 14px 3px; }
    .mock-root .todo-body { padding-inline: 12px; }
  }
  @media (pointer: coarse) {
    .mock-root .todo-tab,
    .mock-root .todo-group-toggle,
    .mock-root .todo-icon-button,
    .mock-root .todo-check-target,
    .mock-root .todo-open { min-height: 44px; }
    .mock-root .todo-check-target svg { top: 17px; }
    .mock-root .todo-title-editor,
    .mock-root .todo-notes-editor,
    .mock-root .todo-add-input { font-size: 16px !important; }
    .mock-root .todo-title-editor { min-height: 44px; padding-block: 10px; }
  }

    .mock-root { padding: 0 !important; color-scheme: dark; }
    .mock-root .todo-window { width: 100%; }
    .mock-root .todo-window input, .mock-root .todo-window textarea, .mock-root .todo-window button { margin: 0; }
    .nord .todo-window { --todo-paper: #2e3440; --todo-ink: #eceff4; --todo-secondary: #d8dee9; --todo-accent: #88c0d0; --todo-selected: #434c5e; --todo-hover: #3b4252; }
    .mocha .todo-window { --todo-paper: #1e1e2e; --todo-ink: #cdd6f4; --todo-secondary: #bac2de; --todo-accent: #89b4fa; --todo-selected: #45475a; --todo-hover: #313244; }
    .glass .todo-window { --todo-paper: rgb(30 30 46 / .8); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); }
    @media (prefers-reduced-transparency: reduce) { .glass .todo-window { --todo-paper: #1e1e2e; backdrop-filter: none; -webkit-backdrop-filter: none; } }
    @media (max-width: 1100px) { .palette-grid { grid-template-columns: 1fr; max-width: 424px; margin: 0 auto; } }
    @media (max-width: 760px) { .opacity-grid { grid-template-columns: 1fr; } .study-header { align-items: start; flex-direction: column; gap: 6px; } .desktop { padding: 28px 14px; } .study { padding: 22px 16px; } }
  </style>
</head>
<body><main class="study">
    <header class="study-header"><h1>Mocha + blur</h1><span>Selected direction</span></header>
    <div class="opacity-grid">

      <figure><figcaption><strong>Blurred background</strong><span>80% opaque</span></figcaption><div class="desktop">
        <div class="desktop-document" aria-hidden="true"><header>Weekend notes</header><article><h2>A few ideas for Saturday</h2><p>Walk by the water and find somewhere for lunch.</p><p>Bring a book. Take the longer way home.</p><p>Leave the afternoon open.</p></article></div>
        <div class="mock-root mocha glass" inert><section class="todo-window" aria-label="Grouped project tabs design sketch" style="--todo-row-space: 1px;">
    <div class="todo-chrome" aria-hidden="true"><span class="todo-light"></span><span class="todo-light"></span><span class="todo-light"></span></div>
    <nav class="todo-nav" aria-label="Projects">
      <div class="todo-tabs"><button type="button" class="todo-tab cursor-interaction" data-project="inbox" aria-pressed="false">Inbox</button><div class="todo-tab-group" role="group" aria-label="Work projects"><button type="button" class="todo-group-toggle cursor-interaction" data-group="work" aria-expanded="true" aria-controls="todo-group-work" aria-label="Work group, collapse, current project App"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="chevron-down" aria-hidden="true" class="lucide lucide-chevron-down"><path d="m6 9 6 6 6-6"></path></svg><span class="todo-group-name">Work</span></button><div class="todo-group-projects" id="todo-group-work"><button type="button" class="todo-tab cursor-interaction" data-project="app" aria-pressed="true">App</button><button type="button" class="todo-tab cursor-interaction" data-project="website" aria-pressed="false">Website</button><button type="button" class="todo-tab cursor-interaction" data-project="tools" aria-pressed="false">Tools</button></div></div><div class="todo-tab-group is-collapsed" role="group" aria-label="Personal projects"><button type="button" class="todo-group-toggle cursor-interaction" data-group="personal" aria-expanded="false" aria-controls="todo-group-personal" aria-label="Personal group, expand"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="chevron-right" aria-hidden="true" class="lucide lucide-chevron-right"><path d="m9 18 6-6-6-6"></path></svg><span class="todo-group-name">Personal</span></button><div class="todo-group-projects" id="todo-group-personal" hidden=""><button type="button" class="todo-tab cursor-interaction" data-project="home" aria-pressed="false">Home</button><button type="button" class="todo-tab cursor-interaction" data-project="travel" aria-pressed="false">Travel</button><button type="button" class="todo-tab cursor-interaction" data-project="health" aria-pressed="false">Health</button><button type="button" class="todo-tab cursor-interaction" data-project="reading" aria-pressed="false">Reading</button></div></div></div>
      <button class="todo-icon-button cursor-interaction" type="button" aria-label="Add project" aria-expanded="false"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="plus" aria-hidden="true" class="lucide lucide-plus"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button>
    </nav>
    <form class="todo-new-project" hidden="">
      <label>Project name<input name="project" autocomplete="off" placeholder="Name, then Return" maxlength="60" value=""></label>
    </form>
    <div class="todo-body">
      <div class="todo-items" role="group" aria-label="App tasks"><div class="todo-row" data-task="a1"><label class="todo-check-target cursor-interaction"><input type="checkbox" class="todo-check cursor-interaction" aria-label="Complete: Sketch the main window" value="on"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="check" aria-hidden="true" class="lucide lucide-check"><path d="M20 6 9 17l-5-5"></path></svg></label><div class="todo-heading"><button type="button" class="todo-open cursor-interaction" aria-expanded="false" aria-label="Sketch the main window, expand details"><span class="todo-task-title">Sketch the main window</span></button></div></div><div class="todo-row" data-task="a2"><label class="todo-check-target cursor-interaction"><input type="checkbox" class="todo-check cursor-interaction" aria-label="Complete: Make project switching feel instant" value="on"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="check" aria-hidden="true" class="lucide lucide-check"><path d="M20 6 9 17l-5-5"></path></svg></label><div class="todo-heading"><textarea class="todo-title-editor" rows="1" aria-label="Task title" style="height: 28px;">Make project switching feel instant</textarea><button type="button" class="todo-icon-button cursor-interaction" aria-label="Collapse task details" aria-expanded="true"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="chevron-down" aria-hidden="true" class="lucide lucide-chevron-down"><path d="m6 9 6 6 6-6"></path></svg></button></div><div class="todo-notes"><textarea class="todo-notes-editor" rows="1" placeholder="Add details…" aria-label="Optional task details" style="height: 22px;">Remember where I was in each list.</textarea></div><div class="todo-subtasks" role="group" aria-label="Subtasks"><div class="todo-subtask is-done"><label class="todo-check-target cursor-interaction"><input type="checkbox" class="todo-check cursor-interaction" aria-label="Complete subtask: Keep the tabs in place" value="on" checked=""><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="check" aria-hidden="true" class="lucide lucide-check"><path d="M20 6 9 17l-5-5"></path></svg></label><input class="todo-subtask-title" aria-label="Subtask title" value="Keep the tabs in place"></div><div class="todo-subtask"><label class="todo-check-target cursor-interaction"><input type="checkbox" class="todo-check cursor-interaction" aria-label="Complete subtask: Restore open task details" value="on"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="check" aria-hidden="true" class="lucide lucide-check"><path d="M20 6 9 17l-5-5"></path></svg></label><input class="todo-subtask-title" aria-label="Subtask title" value="Restore open task details"></div><form class="todo-add todo-subtask-add"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="plus" aria-hidden="true" class="lucide lucide-plus"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg><input class="todo-subtask-title" placeholder="Add subtask…" aria-label="Add subtask, then press Return" value=""></form></div></div><div class="todo-row" data-task="a3"><label class="todo-check-target cursor-interaction"><input type="checkbox" class="todo-check cursor-interaction" aria-label="Complete: Keep agent updates in sync" value="on"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="check" aria-hidden="true" class="lucide lucide-check"><path d="M20 6 9 17l-5-5"></path></svg></label><div class="todo-heading"><button type="button" class="todo-open cursor-interaction" aria-expanded="false" aria-label="Keep agent updates in sync, expand details"><span class="todo-task-title">Keep agent updates in sync</span></button></div></div><div class="todo-row todo-complete" data-task="a4"><label class="todo-check-target cursor-interaction"><input type="checkbox" class="todo-check cursor-interaction" aria-label="Complete: Read through the UI guide" value="on" checked=""><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="check" aria-hidden="true" class="lucide lucide-check"><path d="M20 6 9 17l-5-5"></path></svg></label><div class="todo-heading"><button type="button" class="todo-open cursor-interaction" aria-expanded="false" aria-label="Read through the UI guide, expand details"><span class="todo-task-title">Read through the UI guide</span></button></div></div></div>
      <form class="todo-add">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" data-lucide="plus" aria-hidden="true" class="lucide lucide-plus"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
        <input class="todo-add-input" name="task" aria-label="Add a task, then press Return" placeholder="Add a task…" autocomplete="off" value="">
      </form>
    </div>
    <div class="todo-visually-hidden" role="status" aria-live="polite"></div>
  </section></div>
      </div></figure>
    </div>
    <p class="footer">Design mockup · Dark only · Text and controls stay fully opaque</p>
  </main></body></html>
