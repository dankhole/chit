<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Compact dark todo — design studies</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #111213; color: #ececec; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .study { padding: 26px 26px 30px; }
    .study-header { display: flex; justify-content: space-between; align-items: baseline; gap: 24px; margin: 0 0 24px; }
    .study-header h1 { margin: 0; font-size: 19px; font-weight: 500; }
    .study-header span { color: #aaaaaa; font-size: 12px; }
    .palette-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
    .opacity-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
    figure { margin: 0; min-width: 0; }
    figcaption { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 14px; }
    figcaption strong { font-size: 14px; font-weight: 500; }
    figcaption span { font-size: 12px; color: #aaaaaa; }
    .swatch { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 8px; }
    .desktop { position: relative; overflow: hidden; padding: 42px 32px; border-radius: 10px; background: radial-gradient(ellipse at 95% 100%, #b78952 0%, transparent 66%), radial-gradient(ellipse at 0 20%, #32677d 0%, transparent 66%), #3d374f; }
    .desktop-document { position: absolute; top: 15px; left: 92px; right: -35px; height: 340px; background: #eee9e0; color: #383b3c; border: 1px solid #ffffff38; border-radius: 7px; box-shadow: 0 8px 24px #00000018; overflow: hidden; }
    .desktop-document header { height: 29px; padding: 7px 15px; background: #dad7d0; color: #62645f; font-size: 11px; }
    .desktop-document article { padding: 26px 28px; }
    .desktop-document h2 { font-size: 22px; font-weight: 500; margin: 0 0 14px; }
    .desktop-document p { color: #656764; margin: 9px 0; line-height: 1.9; }
    .desktop .mock-root { position: relative; z-index: 1; }
    .footer { margin: 20px 0 0; font-size: 12px; color: #aaaaaa; }
    [hidden] { display: none !important; }
    /* PRODUCT_STYLES */
    .mock-root { padding: 0 !important; color-scheme: dark; }
    .mock-root .todo-window { width: 100%; }
    .mock-root .todo-window input, .mock-root .todo-window textarea, .mock-root .todo-window button { margin: 0; }
    .nord .todo-window { --todo-paper: #2e3440; --todo-ink: #eceff4; --todo-secondary: #d8dee9; --todo-accent: #88c0d0; --todo-selected: #434c5e; --todo-hover: #3b4252; }
    .mocha .todo-window { --todo-paper: #1e1e2e; --todo-ink: #cdd6f4; --todo-secondary: #bac2de; --todo-accent: #89b4fa; --todo-selected: #45475a; --todo-hover: #313244; }
    .glass .todo-window { --todo-paper: rgb(25 25 25 / .8); backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px); }
    @media (prefers-reduced-transparency: reduce) { .glass .todo-window { --todo-paper: #191919; backdrop-filter: none; -webkit-backdrop-filter: none; } }
    @media (max-width: 1100px) { .palette-grid { grid-template-columns: 1fr; max-width: 424px; margin: 0 auto; } }
    @media (max-width: 760px) { .opacity-grid { grid-template-columns: 1fr; } .study-header { align-items: start; flex-direction: column; gap: 6px; } .desktop { padding: 28px 14px; } .study { padding: 22px 16px; } }
  </style>
</head>
<body>
  <main class="study" id="palette-study">
    <header class="study-header"><h1>A smaller, quieter task list</h1><span>Dark palette studies · same compact layout</span></header>
    <div class="palette-grid">
      <figure><figcaption><strong><i class="swatch" style="background:#a3be8c"></i>Graphite + sage</strong><span>Neutral</span></figcaption><div class="mock-root graphite"><!-- PRODUCT_PANEL --></div></figure>
      <figure><figcaption><strong><i class="swatch" style="background:#88c0d0"></i>Nord</strong><span>Cool blue-gray</span></figcaption><div class="mock-root nord"><!-- PRODUCT_PANEL --></div></figure>
      <figure><figcaption><strong><i class="swatch" style="background:#89b4fa"></i>Catppuccin Mocha</strong><span>Soft violet-gray</span></figcaption><div class="mock-root mocha"><!-- PRODUCT_PANEL --></div></figure>
    </div>
  </main>
  <main class="study" id="opacity-study" hidden>
    <header class="study-header"><h1>Solid or softly see-through?</h1><span>Graphite + sage · identical illustrative desktops</span></header>
    <div class="opacity-grid">
      <figure><figcaption><strong>Solid background</strong><span>100% opaque</span></figcaption><div class="desktop">
        <div class="desktop-document" aria-hidden="true"><header>Weekend notes</header><article><h2>A few ideas for Saturday</h2><p>Walk by the water and find somewhere for lunch.</p><p>Bring a book. Take the longer way home.</p><p>Leave the afternoon open.</p></article></div>
        <div class="mock-root graphite"><!-- PRODUCT_PANEL --></div>
      </div></figure>
      <figure><figcaption><strong>Blurred background</strong><span>80% opaque</span></figcaption><div class="desktop">
        <div class="desktop-document" aria-hidden="true"><header>Weekend notes</header><article><h2>A few ideas for Saturday</h2><p>Walk by the water and find somewhere for lunch.</p><p>Bring a book. Take the longer way home.</p><p>Leave the afternoon open.</p></article></div>
        <div class="mock-root graphite glass"><!-- PRODUCT_PANEL --></div>
      </div></figure>
    </div>
    <p class="footer">Text and controls stay fully opaque. Blur is simulated here; the native macOS material will need a separate visual check.</p>
  </main>
  <script>
    function selectStudy() {
      const showOpacity = location.hash === '#opacity';
      document.getElementById('palette-study').hidden = showOpacity;
      document.getElementById('opacity-study').hidden = !showOpacity;
    }
    window.addEventListener('hashchange', selectStudy);
    selectStudy();
    // Screenshot study only: use dark-compact-sketch.html for the interactive source.
    document.querySelectorAll('.todo-window').forEach((panel, index) => {
      panel.querySelectorAll('[id]').forEach(element => { element.id += '-' + index; });
      panel.querySelectorAll('[aria-controls]').forEach(element => { element.setAttribute('aria-controls', element.getAttribute('aria-controls') + '-' + index); });
      panel.querySelectorAll('button, input, textarea').forEach(control => { control.inert = true; });
    });
  </script>
</body>
</html>
